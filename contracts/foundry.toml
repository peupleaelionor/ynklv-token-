[profile.default]
src              = "src"
out              = "out"
libs             = ["lib"]
test             = "test"
script           = "script"
solc             = "0.8.20"
optimizer        = true
optimizer_runs   = 200
via_ir           = false
fuzz_runs        = 10000
invariant_runs   = 256

# Contract size check (EIP-170 limit: 24576 bytes)
sizes            = true

# Verbosity: 0=quiet, 1=errors, 2=warnings, 3=info, 4=debug
verbosity        = 2

[profile.ci]
fuzz_runs        = 50000
invariant_runs   = 1024

[profile.default.fmt]
line_length      = 100
tab_width        = 4
bracket_spacing  = true
int_types        = "long"
quote_style      = "double"
number_underscore = "thousands"

[rpc_endpoints]
base         = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
mainnet      = "${MAINNET_RPC_URL}"

[etherscan]
base         = { key = "${BASESCAN_API_KEY}", url = "https://api.basescan.org/api" }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }
mainnet      = { key = "${ETHERSCAN_API_KEY}" }
